<body>
<div  class="calculator">
    <div class="input group">
        <input type="number" id="num1" placeholder="first number" step="any"/>
        <select id="operation">
            <option value="add">+</option>
            <option value="subt">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
            <option value="power">x^y</option>
            <option value="sqrt">sqrt</option>
        </select>
        <input type="number"id="num2"placeholder="second(ignore for sqrt)">
    </div>

    <button id="calculateBtn">calculate</button>
    <div id="result">Enter the numbers and press calculate</div>
